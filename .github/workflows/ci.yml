name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the integration test exercises git provenance
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Built CLI runs under Node
        run: |
          cp -R tests/fixtures/shop /tmp/shop
          node bin/specgate.mjs check --cwd /tmp/shop --no-provenance
      - name: IR schema is up to date
        run: bun run schema:emit && git diff --exit-code -- schema/
